name: Semantic Pull-Request

on:
  # SRC: https://github.com/amannn/action-semantic-pull-request?tab=readme-ov-file#installation
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      # - synchronize (if you use required Actions)

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pull-request:
    name: github-actions-compliance
    uses: ./.github/workflows/semantic-pull-request.yml
